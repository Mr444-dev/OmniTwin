version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      opencv:
        patterns:
          - OpenCvSharp4*
      test-framework:
        patterns:
          - xunit*
          - Microsoft.NET.Test.Sdk
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
